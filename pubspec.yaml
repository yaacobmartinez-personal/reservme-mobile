name: reservme
description: "ReservMe - booking for Philippine venues. Customers book without an account; venues run the day."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  animations: ^3.0.0
  app_links: ^7.2.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  image_picker: ^1.2.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/photos/

  # Variable fonts (OFL, Google Fonts). Each family's OFL.txt ships beside
  # it in assets/fonts/. Weight, optical size and Fraunces' SOFT/WONK axes
  # are set per style in lib/core/theme/typography.dart.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
